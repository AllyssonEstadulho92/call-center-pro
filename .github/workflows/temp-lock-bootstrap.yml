# Fluxo descartável: gerar o lockfile no servidor npm do GitHub sem inventar checksums.
# Apagar este workflow da branch antes da integração na main.
name: Bootstrap temporário do package-lock
on:
  push:
    branches:
      - feature/auditoria-fontes-seguranca-v1-9
permissions:
  contents: write
jobs:
  gerar-lockfile:
    if: github.repository == 'AllyssonEstadulho92/call-center-pro' && github.ref == 'refs/heads/feature/auditoria-fontes-seguranca-v1-9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Gerar dependências bloqueadas
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Gravar lockfile gerado pelo npm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: gerar lockfile npm reprodutível"
            git push origin HEAD:feature/auditoria-fontes-seguranca-v1-9
          fi
