# Workflow temporário e limitado à branch de auditoria.
# Gera novamente os checksums reais do lockfile no npm, após atualizar o Vitest.
name: Bootstrap temporário do lockfile de segurança
on:
  push:
    branches: [feature/auditoria-fontes-seguranca-v1-9]
permissions:
  contents: write
jobs:
  resolver-vulnerabilidade:
    if: github.repository == 'AllyssonEstadulho92/call-center-pro' && github.ref == 'refs/heads/feature/auditoria-fontes-seguranca-v1-9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Atualizar lockfile com Vitest corrigido
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Gravar lockfile real
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: atualizar lockfile após upgrade do Vitest"
            git push origin HEAD:feature/auditoria-fontes-seguranca-v1-9
          fi
