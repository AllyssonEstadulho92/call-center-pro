name: Construir aplicação para GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-static-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-site
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript, testes e compilação
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Preparar versão pública estática
        run: |
          test -s dist/app.html
          test -d dist/assets
          cp dist/app.html index.html
          mkdir -p assets
          cp -R dist/assets/. assets/
          touch .nojekyll
          if grep -q '/src/main.tsx' index.html; then
            echo 'Erro: o index.html publicado ainda referencia TypeScript' >&2
            exit 1
          fi
      - name: Guardar versão compilada no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: atualizar versão web compilada"
            git push
          else
            echo "Sem alterações à versão pública."
          fi
