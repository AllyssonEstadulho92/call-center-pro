name: Construir aplicação para GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-static-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-site
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar vulnerabilidades graves nas dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Verificar TypeScript, testes e compilação
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Gerar e validar os dois manuais PDF
        run: |
          python3 -m venv .venv-manual
          .venv-manual/bin/python -m pip install --disable-pip-version-check --no-input reportlab==4.4.9
          node scripts/export-manual-data.mjs .tmp/manual-data.json
          .venv-manual/bin/python scripts/generate_manual_pdfs.py .tmp/manual-data.json manuais
          test -s manuais/manual-coca-cola.pdf
          test -s manuais/manual-burger-king.pdf
      - name: Preparar versão pública estática
        run: |
          test -s dist/app.html
          test -d dist/assets
          test -s package-lock.json
          # Conservar os assets da publicação imediatamente anterior para evitar
          # falhas quando um browser ainda tem em cache o HTML anterior.
          previous_js=$(grep -oE 'assets/app-[^"/]+[.]js' index.html | head -n 1 || true)
          previous_css=$(grep -oE 'assets/app-[^"/]+[.]css' index.html | head -n 1 || true)
          mkdir -p assets
          find assets -maxdepth 1 -type f \( -name 'app-*.js' -o -name 'app-*.css' \) -print0 | while IFS= read -r -d '' file; do
            if [ "$file" != "$previous_js" ] && [ "$file" != "$previous_css" ]; then rm -f "$file"; fi
          done
          cp -R dist/assets/. assets/
          cp dist/app.html index.html
          touch .nojekyll
          if grep -q '/src/main.tsx' index.html; then
            echo 'Erro: o index.html publicado ainda referencia TypeScript' >&2
            exit 1
          fi
      - name: Guardar versão compilada no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets manuais .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: atualizar versão web compilada"
            git push
          else
            echo "Sem alterações à versão pública."
          fi
