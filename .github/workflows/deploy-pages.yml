name: Publicação MANUAL no GitHub Pages

on:
  workflow_dispatch:
    inputs:
      autorizacao:
        description: 'Escreve PUBLICO para confirmar que todos os conteúdos são autorizados para publicação pública.'
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: ${{ inputs.autorizacao == 'PUBLICO' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Rever dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Verificações
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Criar entrada index.html para GitHub Pages
        run: |
          test -s dist/app.html
          cp dist/app.html dist/index.html
      - name: Preparar ficheiros estáticos
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
