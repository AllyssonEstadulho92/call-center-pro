name: Verificação de qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      # Gerar package-lock.json no primeiro npm install e adicioná-lo ao repositório.
      # Depois substituir "npm install" por "npm ci" para instalações reprodutíveis.
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Auditar dependências de produção (alta ou crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Identificar vulnerabilidades críticas em toda a árvore
        run: npm audit --audit-level=critical
      - name: Verificar tipagem TypeScript
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Compilar para produção
        run: npm run build
