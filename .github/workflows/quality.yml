name: Verificação de qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Gerar package-lock.json no primeiro npm install e adicioná-lo ao repositório.
      # Depois substituir "npm install" por "npm ci" para instalações reprodutíveis.
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Auditar dependências de produção (alta ou crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Identificar vulnerabilidades críticas em toda a árvore
        run: npm audit --audit-level=critical
      - name: Verificar tipagem TypeScript
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Compilar para produção
        run: npm run build
      - name: Gerar e validar os dois manuais PDF
        run: |
          python3 -m venv .venv-manual
          .venv-manual/bin/python -m pip install --disable-pip-version-check --no-input reportlab==4.4.9
          node scripts/export-manual-data.mjs .tmp/manual-data.json
          .venv-manual/bin/python scripts/generate_manual_pdfs.py .tmp/manual-data.json manuais
          test -s manuais/manual-coca-cola.pdf
          test -s manuais/manual-burger-king.pdf
